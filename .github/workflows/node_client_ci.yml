name: Node Client CI

on:
  push:
    branches: ["main", "dev/node", "dev/backend"]
  pull_request:
    branches: ["main", "dev/backend", "dev/master"]

jobs:
  # 1. Тестирование с использованием БД
  build-test:
    runs-on: ubuntu-latest
    environment: node_client
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Setup test environment file
        run: |
          echo "📝 Создание .env.node.test..."

          PG_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          cat > node_client/.env.node.test <<EOF
          PYTHONUNBUFFERED=1

          COMMAND_TIMEOUT=30
          WRITE_BUFFER_INTERVAL=10
          WRITE_BUFFER_SIZE=5
          
          PG_DB=test_reinar_db
          PG_PASSWORD=${PG_PASSWORD}
          PG_USER=postgres
          PG_PORT=5432
          PG_HOST=127.0.0.1
  
          NODE_PORT=${{ vars.NODE_PORT }}
          NODE_NAME=${{ vars.NODE_NAME }}
          ADMIN_PANEL_PRIVATE_IP=${{ vars.ADMIN_PANEL_PRIVATE_IP }}
          EOF
          
          cat > node_client/.env <<EOF
          PG_DB=reinar_db
          PG_ADMIN=postgres
          PG_ADMIN_PASSWORD=${PG_PASSWORD}
          PG_PORT=5431
          EOF

      - name: Docker Up DB and Run Migrations
        run: |
          echo "🚀 Запуск PostgreSQL и накатывание миграций..."
          docker compose -f node_client/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from web-db-migrations
          
          echo "✅ Миграции успешно накачены"
          
          # Перезапуск pg_db чтобы он продолжил работать после завершения миграций
          docker compose -f node_client/docker-compose.test.yml up -d pg_db

      - name: Check DB
        run: |
          echo "⏳ Проверка доступности PostgreSQL..."
          for i in {1..6}; do
            if docker exec pg_db pg_isready -U postgres; then
              echo "✅ PostgreSQL готов"
              exit 0
            fi
            sleep 3
          done
          echo "❌ PostgreSQL недоступен"
          docker logs pg_db || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Requirements
        run: pip install -r node_client/requirements.txt

      - name: Run Node Client Tests
        run: python -m pytest tests -v --protocol "*" --mode real

      - name: Stop test containers
        if: always()
        run: docker compose -f node_client/docker-compose.test.yml down -v

  # 2. Установка и Healthcheck
  install-test:
    needs: build-test
    runs-on: ubuntu-latest
    environment: node_client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Client
        env:
          NODE_PORT: ${{ vars.NODE_PORT }}
          NODE_NAME: ${{ vars.NODE_NAME }}
          ADMIN_PANEL_PRIVATE_IP: ${{ vars.ADMIN_PANEL_PRIVATE_IP }}
          CI: 1
        run: |
          echo "🚀 Установка Node Client..."
          chmod +x ./node_client/scripts/install.sh
          sudo -E ./node_client/scripts/install.sh || {
            echo "❌ Ошибка установки Node Client"
            exit 1
          }

      - name: Verify Node Client Health
        env:
          NODE_PORT: ${{ vars.NODE_PORT }}
        run: |
          echo "⏳ Проверка healthcheck Node Client..."
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:${NODE_PORT}/api/v1/server/node/ping | grep -q "200"; then
              echo "✅ Node Client успешно запущен"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Превышено время ожидания. Логи сервиса:"
          sudo journalctl -u vpn-node-client.service -n 100 --no-pager || true
          exit 1