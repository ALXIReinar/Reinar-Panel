[tool.ruff]
# Включаем базовые правила: Pyflakes (F), pycodestyle (E, W), isort (I)
# Этого достаточно, чтобы ловить неиспользуемые импорты, необъявленные переменные и ошибки синтаксиса.
select = ["E", "F", "W", "I"]
ignore = []

# Разрешаем длину строки до 120 (агенты часто пишут длинные строки, не будем их за это душить)
line-length = 120

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# Добавляет RUF100 к вашему текущему списку правил
extend-select = ["RUF100"]

# Игнорировать ошибку E501 (line-too-long)
ignore = ["E501"]


[tool.mypy]
# Основные настройки
python_version = "3.12"
ignore_missing_imports = true # Не ругаться на сторонние либы без стабов (важно для агента!)
follow_imports = "silent"

# ==========================================
# Ищем баги, а не докапываемся до стиля
# ==========================================

# Mypy по умолчанию ИГНОРИРУЕТ функции без аннотаций.
# Включаем это, чтобы он проверял логику внутри нетипизированных функций (найдет много багов).
check_untyped_defs = true

# Главный киллер фич (ловит NoneType ошибки).
# Запрещает передавать `None` туда, где ожидается `str` (требует `Optional[str]`).
strict_optional = true

# Разрешаем не писать типы аргументов и возвращаемых значений
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Разрешаем использовать Any (это как раз твои нетипизированные DI объекты)
disallow_any_expr = false
disallow_any_generics = false

# ==========================================
# Настройки для конкретных микросервисов (если нужно)
# ==========================================
# Например, если в тестах вообще плевать на типы:
[[tool.mypy.overrides]]
module = "*.tests.*"
ignore_errors = true