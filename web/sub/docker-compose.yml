name: reinar_panel_sub

services:
  sub-service:
    build:
      context: ..
    container_name: sub-service
    image: reinar_panel/web_service
    command: python -m web.sub.main
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${SUB_PORT}/api/v1/healthcheck')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    #    restart: always
    environment:
      - ENV_FILE=/run/secrets/env.sub.prod
    network_mode: host
    volumes:
      - ./sub_logs:/app/web/sub/sub_logs
    secrets:
      - env.sub.prod

secrets:
  env.sub.prod:
    file: .env.sub.prod
