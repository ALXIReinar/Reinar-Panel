name: test_reinar_panel_node_client

services:
  pg_db:
    image: postgres:16
    container_name: pg_db
    environment:
      - POSTGRES_USER=${PG_ADMIN}
      - POSTGRES_PASSWORD=${PG_ADMIN_PASSWORD}
      - POSTGRES_DB=test_${PG_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_ADMIN}" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    volumes:
      - pgdata:/var/lib/postgresql/data
      #- ../web/secrets/test_dumps:/docker-entrypoint-initdb.d:z
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"

  web-db-migrations:
    build:
      context: ..
      dockerfile: Dockerfile
    command: sh -c "alembic -c web/alembic.ini upgrade head && python web/db/seed_data.py"
#    command: sh -c "sleep 300 && alembic -c web/alembic.ini upgrade head && python web/db/seed_data.py" # ДЛЯ ДЕБАГА. Позволяет рассмотреть ФС контейнера
    image: reinar_panel/web_service:latest
    container_name: web-db-migrations
    environment:
      - PG_DB=test_${PG_DB}
      - PG_ADMIN=${PG_ADMIN}
      - PG_ADMIN_PASSWORD=${PG_ADMIN_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_HOST=localhost
    depends_on:
      pg_db:
        condition: service_healthy
#    volumes:
#      - ../:/app/web
#      - ../db:/app/web/db:ro
    network_mode: host

volumes:
  pgdata:
    driver: local
