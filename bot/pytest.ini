[pytest]
# Pytest конфигурация для бота

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Директория с тестами
testpaths = tests

# Асинхронные тесты
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Маркеры для группировки тестов
markers =
    unit: Unit тесты (быстрые, изолированные)
    integration: Интеграционные тесты (с реальным Redis)
    slow: Медленные тесты

# Живые логи (log_cli) и -v здесь не включаем: вывод читает агент, каждая строка — токены.
# Нужно подробно — передай флаги явно: ./run.py bot tests -v -o log_cli=true

# Отображение в консоли
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
