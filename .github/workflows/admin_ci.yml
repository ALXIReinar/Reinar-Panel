name: Admin CI

# Запускаем при пуше в main или при создании Pull Request в main
on:
  push:
    branches: ["main", "dev/backend"]
  pull_request:
    branches: ["main", "dev/master"]

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME устанавливается в каждой job отдельно с lowercase преобразованием

jobs:
  # 1. Сборка образа и публикация в GHCR с SHA тегом
  # Образ переиспользуется в test job для ускорения CI
  build:
    runs-on: ubuntu-latest
    environment: test_admin
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')/web_service" >> $GITHUB_ENV

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 2. Тестирование Admin API и ARQ Worker последовательно
  # Образ пуллится из реестра вместо повторной сборки для экономии времени
  # Сначала запускаются тесты Admin API, после их завершения - тесты ARQ Worker
  test:
    needs: build
    runs-on: ubuntu-latest
    environment: test_admin
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')/web_service" >> $GITHUB_ENV

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Generate RSA keys for tests
        run: |
          echo "🔐 Генерация RSA ключей..."
          mkdir -p web/secrets/test_keys
          openssl genrsa -out web/secrets/test_keys/private_key.pem 2048
          openssl rsa -in web/secrets/test_keys/private_key.pem -outform PEM -pubout -out web/secrets/test_keys/public_key.pem
          chmod 644 web/secrets/test_keys/private_key.pem
          chmod 644 web/secrets/test_keys/public_key.pem

      - name: Generate passwords and setup environment files
        run: |
          echo "🔐 Генерация паролей..."
          PG_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          REDIS_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          
          echo "📝 Создание web/.env для docker-compose..."
          cat > web/.env << EOF
          PG_DB=reinar_db
          PG_ADMIN=postgres
          PG_ADMIN_PASSWORD=${PG_PASSWORD}
          PG_PORT=5432
          REDIS_PORT=6379
          ADMIN_PORT=$ADMIN_PORT
          SUB_PORT=8080
          SUB_DOMAIN=test.example.com
          REDIS_PASSWORD=${REDIS_PASSWORD}
          ADMIN_DOMAIN=test.example.com
          EOF
          
          echo "📝 Создание .env.api.test..."
          echo "$ENV_API_TEST_FILE" > web/.env.api.test
          cat >> web/.env.api.test << EOF
          PG_ADMIN=postgres
          PG_ADMIN_PASSWORD=${PG_PASSWORD}
          PG_USER=postgres
          PG_PASSWORD=${PG_PASSWORD}
          PG_PORT=5432
          PG_HOST=pg_db
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${REDIS_PASSWORD}
          APP_MODE=docker
          UVICORN_PORT=$ADMIN_PORT
          EOF
          
          echo "📝 Создание .env.arq.test..."
          echo "$ENV_ARQ_TEST_FILE" > web/arq_worker/.env.arq.test
          cat >> web/arq_worker/.env.arq.test << EOF
          PG_USER=postgres
          PG_PASSWORD=${PG_PASSWORD}
          PG_PORT=5432
          PG_HOST=localhost
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=${REDIS_PASSWORD}
          APP_MODE=docker
          EOF
        env:
          ENV_API_TEST_FILE: ${{ vars.ENV_API_TEST_FILE }}
          ENV_ARQ_TEST_FILE: ${{ vars.ENV_ARQ_TEST_FILE }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        run: |
          echo "📥 Получение образа из GHCR..."
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${SHORT_SHA}"
          docker pull ${IMAGE_TAG}
          docker tag ${IMAGE_TAG} reinar_panel/web_service:${SHORT_SHA}
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Run Admin API tests
        run: |
          echo "🧪 Запуск тестов Admin API..."
          docker compose -f web/docker-compose.test_admin.yml up --abort-on-container-exit --exit-code-from web-service

      - name: Stop Admin test containers
        if: always()
        run: |
          echo "🛑 Остановка контейнеров Admin API..."
          docker compose -f web/docker-compose.test_admin.yml down -v

      - name: Run ARQ Worker tests
        run: |
          echo "🧪 Запуск тестов ARQ Worker..."
          docker compose -f web/docker-compose.test_arq_worker.yml up --abort-on-container-exit --exit-code-from arq-sub-worker

      - name: Stop ARQ Worker test containers
        if: always()
        run: |
          echo "🛑 Остановка контейнеров ARQ Worker..."
          docker compose -f web/docker-compose.test_arq_worker.yml down -v

  # 3. Установка и Healthcheck
  # Использует локальную сборку через install.sh (production сценарий)
  install-test:
    needs: test
    runs-on: ubuntu-latest
    environment: test_admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Check and free ports
        run: |
          echo "🔍 Проверка занятости портов..."
          sudo lsof -i :5432 || echo "Порт 5432 свободен"
          sudo lsof -i :6379 || echo "Порт 6379 свободен"

      - name: Run Installation Script
        env:
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
          ADMIN_DOMAIN: "admin.reinar.com"
          SUB_SERVICE_DOMAIN: "sub.service.example"
        run: |
          echo "🚀 Запуск скрипта установки..."
          chmod +x ./web/scripts/install.sh
          sudo -E ./web/scripts/install.sh || {
            echo "❌ Ошибка установки, логи контейнеров:"
            sudo docker logs pg_db 2>&1 || echo "Контейнер pg_db не найден"
            sudo docker logs redis 2>&1 || echo "Контейнер redis не найден"
            sudo docker logs web-service 2>&1 || echo "Контейнер web-service не найден"
            sudo docker logs arq-sub-worker 2>&1 || echo "Контейнер arq-sub-worker не найден"
            sudo docker logs caddy-admin 2>&1 || echo "Контейнер caddy-admin не найден"
            exit 1
          }

      - name: Verify Service Health
        env:
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
        run: |
          echo "⏳ Проверка healthcheck..."
          
          # В CI используем HTTP для проверки (Caddy может не успеть получить сертификат)
          HEALTH_URL="http://localhost:${ADMIN_PORT}/api/v1/healthcheck"
          
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" ${HEALTH_URL} | grep -q "200"; then
              echo "✅ Healthcheck успешен"
              exit 0
            fi
            echo "Попытка $i/12..."
            sleep 5
          done
          
          echo "❌ Healthcheck не прошёл"
          docker logs web-service || true
          docker logs caddy-admin || true
          exit 1