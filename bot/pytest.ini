[pytest]
# Pytest конфигурация для бота

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Директория с тестами
testpaths = tests

# Асинхронные тесты
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Маркеры для группировки тестов
markers =
    unit: Unit тесты (быстрые, изолированные)
    integration: Интеграционные тесты (с реальным Redis)
    slow: Медленные тесты

# Минимальный уровень логирования
log_cli = true
log_cli_level = INFO

# Отображение в консоли
console_output_style = progress
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
