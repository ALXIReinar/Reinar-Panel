name: Sub Service CI

on:
  push:
    branches: ["main", "dev/backend", "dev/sub"]
  pull_request:
    branches: ["main", "dev/backend", "dev/master"]

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME устанавливается в каждой job отдельно с lowercase преобразованием

jobs:
  # 1. Сборка образа и публикация в GHCR с SHA тегом
  build:
    runs-on: ubuntu-latest
    environment: sub
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')/web_service" >> $GITHUB_ENV

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 2. Тестирование с переиспользованием образа из GHCR
  test:
    needs: build
    runs-on: ubuntu-latest
    environment: sub
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')/web_service" >> $GITHUB_ENV

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Generate passwords and setup environment files
        run: |
          echo "� Генерация паролей..."
          PG_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          REDIS_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          
          echo "�📝 Создание web/sub/.env для docker-compose..."
          cat > web/sub/.env << EOF
          PG_DB=reinar_db
          PG_ADMIN=postgres
          PG_ADMIN_PASSWORD=${PG_PASSWORD}
          PG_PORT=5432
          REDIS_PORT=6379
          SUB_PORT=${{ vars.SUB_PORT }}
          SUB_DOMAIN=test.example.com
          REDIS_PASSWORD=${REDIS_PASSWORD}
          EOF
          
          echo "📝 Создание .env.sub.test..."
          cat > web/sub/.env.sub.test <<EOF
          PG_USER=postgres
          PG_PASSWORD=${PG_PASSWORD}
          PG_DB=reinar_db
          PG_HOST=localhost
          PG_PORT=5432
          PG_MAX_CONNECTIONS=50
          DOMAIN=http://127.0.0.1:8080
          TG_BOT_SERVICE_PRIVATE_IP=127.0.0.1,10.0.0.2

          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_MAX_CONNECTIONS=50
          REDIS_HOST=localhost
          REDIS_PORT=6379

          UVICORN_WORKERS=1
          POST_PROCESSING_RESPONSES=1
          UVICORN_PORT=${{ vars.SUB_PORT }}

          ROBO_SHOP_LOGIN=${{ secrets.ROBO_SHOP_LOGIN }}
          ROBO_CRYPT_ALGORITHM=sha256
          ROBO_PASSW_1=${{ secrets.ROBO_PASSW_1 }}
          ROBO_PASSW_2=${{ secrets.ROBO_PASSW_2 }}

          ARQ_QUEUE_NAME=arq:test_cron_background_queue
          ARQ_MAX_JOBS=10
          ARQ_JOB_TIMEOUT=300

          ACTION_ON_CORE_PROTO_LIMIT=10
          SUBSCRIPTION_UPDATE_INTERVAL=12
          SUB_LINK_BYTES=32
          TG_BOT_LINK=https://t.me/your_bot

          APP_MODE=docker
          TRUSTED_PROXIES=127.0.0.1
          PAY_MODE=test
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        run: |
          echo "📥 Получение образа из GHCR..."
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${SHORT_SHA}"
          docker pull ${IMAGE_TAG}
          docker tag ${IMAGE_TAG} reinar_panel/web_service:${SHORT_SHA}
          echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Start DB and run migrations
        run: |
          echo "🚀 Запуск БД и миграций..."
          docker compose -f web/sub/docker-compose.test.yml up -d pg_db redis
          docker compose -f web/sub/docker-compose.test.yml up web-db-migrations
          echo "✅ Миграции накачены"

      - name: Run tests
        run: |
          echo "🧪 Запуск тестов..."
          docker compose -f web/sub/docker-compose.test.yml up --abort-on-container-exit --exit-code-from sub-service

      - name: Stop test containers
        if: always()
        run: docker compose -f web/sub/docker-compose.test.yml down -v

  # 3. Установка и Healthcheck
  # Сначала устанавливаем admin, затем sub-сервис
  install-test:
    needs: test
    runs-on: ubuntu-latest
    environment: sub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Install Admin Panel first
        env:
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
          ADMIN_DOMAIN: "admin.ci.local"
          SUB_SERVICE_DOMAIN: "https://sub.example.com"
          PG_ADMIN_PASSWORD: "AdminPass123"
          PG_CRUD_PASSWORD: "CrudPass123"
        run: |
          echo "🚀 Установка Admin Panel..."
          chmod +x ./web/scripts/install.sh
          sudo -E ./web/scripts/install.sh || {
            echo "❌ Ошибка установки Admin Panel"
            sudo docker logs pg_db 2>&1 || true
            sudo docker logs web-service 2>&1 || true
            sudo docker logs arq-sub-worker 2>&1 || true
            exit 1
          }

      - name: Install Sub Service
        env:
          SUB_PORT: ${{ vars.SUB_PORT }}
          SUB_DOMAIN: "localhost"
          PG_CRUD_PASSWORD: "CrudPass123"
          ROBO_SHOP_LOGIN: "TestShopLogin"
          ROBO_PASSW_1: "TestPassword1"
          ROBO_PASSW_2: "TestPassword2"
          TG_BOT_LINK: "https://t.me/test_bot"
        run: |
          echo "🚀 Установка Sub Service..."
          chmod +x ./web/sub/scripts/install.sh
          sudo -E ./web/sub/scripts/install.sh || {
            echo "❌ Ошибка установки Sub Service"
            sudo docker logs web-service  2>&1 || true
            sudo docker logs sub-service 2>&1 || true
            exit 1
          }

      - name: Verify Sub Service Health
        env:
          SUB_PORT: ${{ vars.SUB_PORT }}
        run: |
          echo "⏳ Проверка healthcheck Sub Service..."
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:${SUB_PORT}/api/v1/healthcheck | grep -q "200"; then
              exit 0
            fi
            sleep 5
          done
          sudo docker logs sub-service || true
          exit 1
