name: reinar_panel_bot

services:
  redis-bot:
    image: redis:7.2-alpine
    container_name: redis-bot
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  bot:
    image: reinar_panel/bot_service
    build: .
    container_name: bot
    environment:
      - ENV_FILE=/run/secrets/.env.bot.prod
    volumes:
      - ./bot_logs:/app/bot/bot_logs
    secrets:
      - .env.bot.prod
    network_mode: host

volumes:
  redis_data:
    driver: local

secrets:
  .env.bot.prod:
    file: .env.bot.prod
