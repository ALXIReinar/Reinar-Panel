name: reinar_panel_admin

services:
  pg_db:
    image: postgres:16
    container_name: pg_db
    environment:
      - POSTGRES_USER=${PG_ADMIN}
      - POSTGRES_PASSWORD=${PG_ADMIN_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: on-failure
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-entrypoint:/docker-entrypoint-initdb.d:z
    ports:
      - "127.0.0.1:${PG_PORT}:5432"

  redis-main:
    image: redis:7.2-alpine
    container_name: redis-main
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  web-service:
    container_name: web-service
    image: reinar_panel/web_service:latest
    depends_on:
      pg_db:
        condition: service_healthy
      web-db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${ADMIN_PORT}/api/v1/healthcheck')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
#    restart: unless-stopped
    environment:
      - ENV_FILE=/run/secrets/env.api.prod
    network_mode: host
    volumes:
      - ./secrets/keys:/app/web/secrets/keys:ro
      - ./web_logs:/app/web/web_logs
#      - .:/app/web
    secrets:
      - env.api.prod
      - private_key.pem
      - public_key.pem

  web-db-migrations:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "alembic -c web/alembic.ini upgrade head && python web/db/seed_data.py"
    image: reinar_panel/web_service:latest
    container_name: web-db-migrations
    environment:
      - ENV_FILE=/run/secrets/env.api.prod
    depends_on:
      pg_db:
        condition: service_healthy
    volumes:
      - ./secrets/keys:/app/web/secrets/keys:ro
      - ./db:/app/web/db:ro
    network_mode: host
    secrets:
      - env.api.prod

  arq-sub-worker:
    container_name: arq-sub-worker
    image: reinar_panel/web_service:latest
    command: python -m arq web.arq_worker.arq_config.WorkerSettings
    depends_on:
      pg_db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    environment:
      - ENV_FILE=/run/secrets/env.arq.prod
    network_mode: host
    volumes:
      - ./arq_logs:/app/web/arq_worker/arq_logs
    secrets:
      - env.arq.prod

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy-admin
    restart: unless-stopped
    depends_on:
      web-service:
        condition: service_healthy
    environment:
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-localhost}
      - ADMIN_PORT=${ADMIN_PORT:-8000}
      - SUB_DOMAIN=${SUB_DOMAIN:-}
      - SUB_PORT=${SUB_PORT:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin.caddy:/etc/caddy/conf.d/admin.caddy:ro
#      - ./sub/sub.caddy:/etc/caddy/conf.d/sub.caddy:ro
      - ../frontend:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: host

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

secrets:
  env.api.prod:
    file: .env.api.prod
  env.arq.prod:
    file: arq_worker/.env.arq.prod
  private_key.pem:
    file: secrets/keys/private_key.pem
  public_key.pem:
    file: secrets/keys/public_key.pem

