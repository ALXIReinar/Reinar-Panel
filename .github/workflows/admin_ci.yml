name: Admin CI

# Запускаем при пуше в main или при создании Pull Request в main
on:
  push:
    branches: ["main", "dev/backend"]
  pull_request:
    branches: ["main", "dev/backend"]

jobs:
  # 1. Сборка проекта
  build:
    runs-on: ubuntu-latest
    environment: test_admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Check available variables
        run: |
          echo "🔍 Проверка доступных переменных..."
          echo "ARTIFACTS_B64 length: ${#ARTIFACTS_B64}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          if [ -z "$ARTIFACTS_B64" ]; then
            echo "❌ Ошибка: переменная ARTIFACTS_B64 не установлена или пуста"
            echo "Настройте её в Settings → Environments → test_admin"
            exit 1
          fi
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          if [ $? -ne 0 ]; then
            echo "❌ Ошибка декодирования base64"
            exit 1
          fi
          tar -xzf artifacts.tar.gz
          if [ $? -ne 0 ]; then
            echo "❌ Ошибка распаковки tar.gz"
            exit 1
          fi
          echo "✓ Артефакты распакованы"
          ls -la web/secrets/ || true
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Generate RSA keys for tests
        run: |
          echo "🔐 Генерация RSA ключей для тестов..."
          mkdir -p web/secrets/test_keys
          openssl genrsa -out web/secrets/test_keys/private_key.pem 2048
          openssl rsa -in web/secrets/test_keys/private_key.pem -outform PEM -pubout -out web/secrets/test_keys/public_key.pem
          echo "✓ Ключи сгенерированы"

      - name: Build Docker image
        run: |
          echo "🔨 Начинаем сборку..."
          docker build -t reinar_panel/web_service:latest web/

  test:
    needs: build
    runs-on: ubuntu-latest
    environment: test_admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode and extract artifacts
        run: |
          echo "📦 Распаковка артефактов..."
          if [ -z "$ARTIFACTS_B64" ]; then
            echo "❌ Ошибка: переменная ARTIFACTS_B64 не установлена"
            echo "Проверьте environment 'test_admin'"
            exit 1
          fi
          echo "$ARTIFACTS_B64" | base64 -d > artifacts.tar.gz
          tar -xzf artifacts.tar.gz
          echo "✓ Артефакты распакованы"
          ls -la web/secrets/ || true
        env:
          ARTIFACTS_B64: ${{ vars.ARTIFACTS_B64 }}

      - name: Generate RSA keys for tests
        run: |
          echo "🔐 Генерация RSA ключей для тестов..."
          mkdir -p web/secrets/test_keys
          openssl genrsa -out web/secrets/test_keys/private_key.pem 2048
          openssl rsa -in web/secrets/test_keys/private_key.pem -outform PEM -pubout -out web/secrets/test_keys/public_key.pem
          echo "✓ Ключи сгенерированы"

      - name: Setup test environment file
        run: |
          echo "📝 Создание .env.api.test..."
          if [ -z "$ENV_API_TEST_FILE" ]; then
            echo "❌ Ошибка: переменная ENV_API_TEST_FILE не установлена"
            exit 1
          fi
          if [ -z "$ADMIN_PORT" ]; then
            echo "❌ Ошибка: переменная ADMIN_PORT не установлена"
            exit 1
          fi
          echo "$ENV_API_TEST_FILE" > web/.env.api.test
          echo "UVICORN_PORT=$ADMIN_PORT" >> web/.env.api.test
          echo "✓ Файл окружения создан"
        env:
          ENV_API_TEST_FILE: ${{ vars.ENV_API_TEST_FILE }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}

      - name: Run tests
        run: |
          echo "🧪 Запускаем тесты..."
          docker compose -f web/docker-compose.test_admin.yml up --abort-on-container-exit --exit-code-from web-service

      - name: Stop test containers
        if: always()
        run: |
          echo "🛑 Остановка тестовых контейнеров..."
          docker compose -f web/docker-compose.test_admin.yml down -v
          echo "✓ Контейнеры остановлены"

  # 3. Установка и Healthcheck (запустится только если test успешен)
  install-test:
    needs: test
    runs-on: ubuntu-latest
    environment: test_admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Installation Script
        env:
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
        run: |
          echo "🚀 Запускаем скрипт установки..."
          echo "ADMIN_PORT: ${ADMIN_PORT}"
          chmod +x ./web/scripts/install.sh
          sudo -E ./web/scripts/install.sh

      - name: Verify Service Health
        env:
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
        run: |
          echo "⏳ Проверка работоспособности сервиса..."
          for i in {1..12}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:${ADMIN_PORT}/api/v1/healthcheck | grep -q "200"; then
              echo "✅ Сервис успешно запущен и готов к работе!"
              exit 0
            fi
            echo "Ожидание... ($i/12)"
            sleep 5
          done
          
          echo "❌ Ошибка: Сервис не удалось запустить"
          echo "📋 Логи контейнера:"
          docker logs web-service || true
          exit 1