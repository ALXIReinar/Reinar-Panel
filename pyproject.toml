# ===============
# MyPy
# ===============
[tool.mypy]
# Основные настройки
python_version = "3.12"
ignore_missing_imports = true # Не ругаться на сторонние либы без стабов (важно для агента!)
follow_imports = "silent"

# ==========================================
# Ищем баги, а не докапываемся до стиля
# ==========================================

# Включаем это, чтобы он проверял логику внутри нетипизированных функций.
check_untyped_defs = true

# Запрещает передавать `None` туда, где ожидается `str` (требует `Optional[str]`).
strict_optional = true

# Разрешаем не писать типы аргументов и возвращаемых значений
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Разрешаем использовать Any (например, для нетипизированных DI объектов)
disallow_any_expr = false
disallow_any_generics = false

# Пакеты без stub-файлов не считаем ошибкой: сломанные импорты ловит pylint (import-error).
warn_unused_ignores = true
exclude = ["^\\.venv", "^mutants/", "/alembic/versions/"]

# В тестах типы не проверяем.
[[tool.mypy.overrides]]
module = "*.tests.*"
ignore_errors = true

# ===============
# Ruff
# ===============
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv*", "mutants"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# F — реальные ошибки (неопределённые имена, неиспользуемые импорты), E/W — pycodestyle,
# I — сортировка импортов, B — типовые баги (мутабельные дефолты, except без смысла),
# UP — устаревший синтаксис, ASYNC — блокирующие вызовы в async-коде (важно для FastAPI/arq).
select = ["F", "E", "W", "I", "B", "UP", "ASYNC"]
ignore = [
    "E501",  # длину строк решает форматтер
    "B008",  # FastAPI: Depends(...) в значениях по умолчанию — норма
]
# RUF100 — лишние `# noqa`.
extend-select = ["RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["web", "bot", "node_client"]

[tool.mutmut]
# mutmut 3: что мутировать и как гонять тесты. Сузь paths_to_mutate до модуля,
# который проверяешь, — полный прогон по монорепозиторию идёт часами.
paths_to_mutate = ["node_client/"]
tests_dir = ["node_client/tests/"]
pytest_add_cli_args = ["-c", "node_client/pytest.ini", "-x", "-q"]
